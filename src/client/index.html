<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <!-- interactive-widget=resizes-content: 키보드가 올라오면 브라우저가 **레이아웃 뷰포트를 줄인다**.
       그러면 100dvh 가 곧 «키보드 위 남은 높이» 라 JS 가 할 일이 없다. 지원 안 하는 판에서는 무시되고
       App.tsx 의 useKeyboard(--vvh) 가 대신 받는다 — 둘 다 같은 답을 내므로 겹쳐도 안전하다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#141414" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- 상태바는 시스템이 그린다(불투명, theme-color 색). 웹뷰가 그 아래서 시작해 위 여백·블러를 앱이 계산할 일이 없다 — elon-bookclub 과 같은 방식 (2026-09-13 Dave) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Folder Bot" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <title>Folder Bot</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/main.tsx"></script>
</body>
</html>
