<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <!-- ⛔ interactive-widget=resizes-content 를 넣지 마라 (2026-09-13 실사고 · 한 라운드 만에 되돌림).
       그걸 넣으면 iOS 26 이 레이아웃 뷰포트까지 줄이는데 100dvh 는 그만큼 안 줄어서, 루트가 화면보다
       커지고 **대화가 키보드 위로 안 올라온다**(Dave 3차 스크린샷). 키보드 높이는 App.tsx 의
       useKeyboard 하나가 정한다 — 두 장치가 서로 다른 답을 내는 순간 이 버그가 다시 난다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#141414" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- 상태바는 시스템이 그린다(불투명, theme-color 색). 웹뷰가 그 아래서 시작해 위 여백·블러를 앱이 계산할 일이 없다 — elon-bookclub 과 같은 방식 (2026-09-13 Dave) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Folder Bot" />
  <link rel="manifest" href="/manifest.webmanifest?v=2" />
  <!-- 홈 화면 아이콘 — iOS 가 이 링크를 못 받으면 글자(«F») 아이콘을 만든다. 기본 자리(/apple-touch-icon.png)에도 같은 그림을 둔다 (2026-10-19 Dave 스크린샷).
       ?v=2 — 서버를 고친 뒤 다시 추가해도 «F» 가 남았다(10:59 · v197). Safari 가 옛 주소로 받은 «아이콘 없음» 을 기억하는 것으로 보고 주소를 바꿔 새로 받게 한다 -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <title>Folder Bot</title>
  <!-- 🔴 CF ① A · 첫 그림 (2026-10-19 Dave «전부 A» · 목업 03_디자인/2026-10-12_로딩-전환-목업 ①).
       JS 가 다 올 때까지 검은 빈 판이었다(폰 원격 1.0초 · 나쁜 망 3.0초). 앱의 «호스트에 연결하는 중…» 화면(App.tsx `!s.loaded`)과
       **같은 모양**을 HTML 에 그대로 넣는다 — 스타일도 여기 인라인이라 CSS 파일을 기다리지 않는다. React 가 #root 를 처음 그리는 순간 이 그림을 걷는다.
       ⚠ 테마는 앱(`theme.ts` applyTheme)과 같은 값을 먼저 정한다 — 라이트 테마에서 검은 판이 한 번 번쩍이지 않게. -->
  <script>try{var t=localStorage.getItem('fb:theme')||'auto';var d=t==='dark'||(t==='auto'&&!matchMedia('(prefers-color-scheme: light)').matches);document.documentElement.dataset.theme=d?'dark':'light';var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',d?'#141414':'#ffffff')}catch(e){}</script>
  <style>
    html,body{height:100%;margin:0;background:#141414}
    :root[data-theme="light"],:root[data-theme="light"] body{background:#fff}
    #fb-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;background:#141414;color:#666;font:13px/1.65 'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;text-align:center;-webkit-font-smoothing:antialiased}
    :root[data-theme="light"] #fb-splash{background:#fff;color:#8a8a8a}
    #fb-splash .bd{fill:#e08850;stroke:#141414}
    :root[data-theme="light"] #fb-splash .bd{fill:#c2662f;stroke:#fff}
  </style>
</head>
<body>
  <div id="root"><div id="fb-splash" role="status"><svg viewBox="0 0 64 64" width="40" height="40" style="display:block;overflow:visible" aria-hidden="true"><path d="M6 14a4 4 0 0 1 4-4h14l5 5h29a4 4 0 0 1 4 4v33a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z" fill="#e08850" opacity=".55"/><path d="M6 24a4 4 0 0 1 4-4h48a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z" fill="#e08850"/><rect x="20" y="33" width="6" height="8" rx="3" fill="rgba(0,0,0,.6)"/><rect x="38" y="33" width="6" height="8" rx="3" fill="rgba(0,0,0,.6)"/><path d="M27 46h10" stroke="rgba(0,0,0,.6)" stroke-width="3" stroke-linecap="round"/><circle class="bd" cx="56" cy="56" r="7" stroke-width="3"/></svg>호스트에 연결하는 중…</div></div>
  <script type="module" src="/main.tsx"></script>
</body>
</html>
