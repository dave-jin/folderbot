name: desktop (macOS)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'src/**', 'scripts/**', 'package.json', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build host + client (bundled)
        run: |
          npm ci --no-audit --no-fund
          BUNDLE_ALL=1 node scripts/build.mjs
          rm -rf desktop/host && mkdir -p desktop/host && cp -r dist/host dist/client desktop/host/
          cp package.json desktop/host/package.json
      - name: Install (desktop) + 버전 도장 0.2.<run_number>
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm version 0.2.${{ github.run_number }} --no-git-tag-version
      - name: Build DMG + zip (arm64, ad-hoc signed)
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: npx electron-builder --mac --arm64 --publish never
      - name: Verify ad-hoc signature (알림 센터 등록 조건)
        working-directory: desktop
        run: |
          APP="dist/mac-arm64/Folder Bot.app"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -5
          codesign --verify --deep --strict "$APP"
          unzip -l dist/*.zip | grep -q "Folder Bot.app/Contents/_CodeSignature/CodeResources" || { echo "❌ zip 안 번들에 _CodeSignature 가 없다 — 알림이 안 온다"; exit 1; }
      - name: Checksums
        working-directory: desktop/dist
        run: |
          for f in *.zip *.dmg; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -la
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ github.run_number }}
          name: Folder Bot desktop (build ${{ github.run_number }})
          body: |
            Folder Bot 데스크톱 0.2.${{ github.run_number }} · Apple Silicon · ad-hoc 서명(개발자 인증서 없음). 설치된 앱이 스스로 받아 재시작합니다.
            처음 열 때 "확인되지 않은 개발자" 가 뜨면 Finder 에서 우클릭 → 열기. "손상됨" 이 뜨면 터미널에서:
            `xattr -dr com.apple.quarantine "/Applications/Folder Bot.app"`
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.sha256
