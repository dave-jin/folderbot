appId: com.dave.folderbot
productName: Folder Bot
directories:
  output: dist
  buildResources: build
# 🔴 **여기 적힌 파일만 앱 안에 들어간다.** 빠뜨리면 개발에서는 멀쩡하고 **패키징한 앱만**
#    «Cannot find module './x'» 로 뜨자마자 죽는다 (2026-09-13 실사고 — `trayIcon.js`).
#    ⚠ 새 파일을 만들면 여기에 **반드시** 적는다. 잊어도 유닛 검사(`test/unit/desktopFiles.test.ts`)가
#    main.js 에서 타고 갈 수 있는 모든 로컬 require 를 훑어 잡는다.
files:
  - main.js
  - preload.js
  - updater.js
  - update-pick.js
  - perms.js
  - perm-core.js
  - trayIcon.js
  - winBounds.js
  - nav.js
  - localfs.js
  - tray-preload.js
  - connect.html
  - package.json
  - build/trayTemplate.png
  - build/trayTemplate@2x.png
  - host/**
extraResources:
  - from: build/icon.png
    to: icon.png
asar: true
# ⚠ identity: null 은 서명 생략이다 — 알림 센터 등록에 필요한 ad-hoc 서명은 afterPack 이 한다
afterPack: ./afterPack.js
npmRebuild: false
protocols:
  - name: Folder Bot
    schemes: [folderbot]
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  icon: build/icon.png
  category: public.app-category.productivity
  identity: null
  # 서명은 afterPack.js 의 codesign --sign - 가 한다 (electron-builder 의 identity 로는 ad-hoc 을 못 시킨다)
  darkModeSupport: true
  extendInfo:
    LSUIElement: false
    NSUserNotificationAlertStyle: alert
dmg:
  sign: false
  contents:
    - { x: 140, y: 200 }
    - { x: 420, y: 200, type: link, path: /Applications }
    - { x: 280, y: 360, type: file, path: build/처음 설치 후 읽어주세요.txt }
