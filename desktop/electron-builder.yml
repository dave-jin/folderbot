appId: com.dave.folderbot
productName: Folder Bot
directories:
  output: dist
  buildResources: build
files:
  - main.js
  - preload.js
  - updater.js
  - update-pick.js
  - perms.js
  - perm-core.js
  - connect.html
  - package.json
  - build/trayTemplate.png
  - build/trayTemplate@2x.png
  - host/**
extraResources:
  - from: build/icon.png
    to: icon.png
asar: true
# ⚠ identity: null 은 서명 생략이다 — 알림 센터 등록에 필요한 ad-hoc 서명은 afterPack 이 한다
afterPack: ./afterPack.js
npmRebuild: false
protocols:
  - name: Folder Bot
    schemes: [folderbot]
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  icon: build/icon.png
  category: public.app-category.productivity
  identity: null
  # 서명은 afterPack.js 의 codesign --sign - 가 한다 (electron-builder 의 identity 로는 ad-hoc 을 못 시킨다)
  darkModeSupport: true
  extendInfo:
    LSUIElement: false
    NSUserNotificationAlertStyle: alert
dmg:
  sign: false
  contents:
    - { x: 140, y: 200 }
    - { x: 420, y: 200, type: link, path: /Applications }
    - { x: 280, y: 360, type: file, path: build/처음 설치 후 읽어주세요.txt }
